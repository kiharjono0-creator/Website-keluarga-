ad{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.branch-number{font-size:9px;letter-spacing:1px;font-weight:900;color:#7a6b4e}.branch-dot{font-size:16px}.member-main{width:100%;border:1px solid #b8c6aa;background:#eff4e9;border-radius:14px;padding:12px;text-align:left;color:#173d2b}.member-main strong{display:block;font-size:15px}.member-main small,.empty-slot small{display:block;font-size:10px;color:#70786d;margin-top:3px}.empty-slot{min-height:77px;border:1px dashed #c8bd9d;border-radius:14px;background:#f9f6e9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7b806f}.empty-slot span{font-size:22px;color:#b08a43}.empty-slot b{font-size:12px}.branch-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.descendants{margin-top:8px;border-top:1px solid #e2dbc8;padding-top:7px}.descendants>b{font-size:10px;color:#687268}.desc-row,.all-member,.result-card{width:100%;border:0;border-bottom:1px solid #e4ddcc;background:transparent;padding:8px 2px;text-align:left;color:#314638}.desc-row{display:flex;justify-content:space-between;font-size:11px}.desc-row span{color:#8b7650;font-size:9px}.all-member{display:flex;justify-content:space-between;align-items:center}.all-member small{display:block;color:#75806f;font-size:10px;margin-top:2px}.search-results{border:2px solid #c9a85a}.result-card{display:block;padding:11px;border-radius:12px;background:#f7f3e6;margin-top:6px}.result-card b,.result-card span,.result-card small{display:block}.result-card span{font-size:11px;color:#6c756b;margin-top:2px}.result-card small{font-size:10px;color:#8a7755;margin-top:3px}.member-detail{text-align:center}.detail-icon{font-size:35px;margin-bottom:4px}.member-detail>small{font-weight:900;color:#7d755f;letter-spacing:1px}.member-detail h2{font:700 29px Georgia,serif;color:#173d2b;margin:5px 0 16px}.detail-line{display:flex;justify-content:space-between;gap:15px;text-align:left;border-top:1px solid #e1dac6;padding:10px 0;fo <body>
<div id="app">
<header class="header">
 <div class="header-inner">
  <h1 id="brand">🌳 KELUARGA BESAR NENE PALA</h1>
  <p id="slogan">Bersatu Dalam Kasih Keluarga</p>
  <nav class="nav" id="nav"></nav>
 </div>
</header>
<main>
<section id="home" class="page active"></section>
<section id="silsilah" class="page"></section>
<section id="jadwal" class="page"></section>
<section id="kas" class="page"></section>
<section id="admin" class="page"></section>
<div class="footer">🌿 KELUARGA BESAR NENE PALA • Taman Keluarga Digital</div>
</main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY="nenePalaDataV1";
const defaults={
 identity:{name:"KELUARGA BESAR NENE PALA",slogan:"Bersatu Dalam Kasih Keluarga",location:"Manggi, Mamasa, Sulawesi Barat",kk:120,members:450,wa:"",fb:"",maps:"",bank:"",account:"",owner:""},
 welcome:"Selamat Datang di Website Keluarga Besar Nene Pala. Semoga menjadi ruang untuk mengenal, menjaga, dan mempererat hubungan keluarga.",
 infos:[],
 messages:[
  {title:"Pesan Keluarga",body:"Jaga kasih, hormati yang lebih tua, dan saling membantu dalam keluarga."},
  {title:"Pesan Hari Ini",body:"Keluarga yang kuat tumbuh dari kebersamaan dan kepedulian."},
  {title:"Renungan Keluarga",body:"Warisan terbaik adalah kasih dan hubungan baik antar generasi."}
 ],
 photos:["","","","","",""],
 schedule:[],
 silsilah:{root:"Nene Pala",people:Array.from({length:16},(_,i)=>({id:"slot"+(i+1),name:"",parent:"root",gen:2,slot:i+1}))},
 kasNames:["Kas Keluarga","Kas Pembangunan","Kas Sosial","Kas Lainnya"],
 kas:[
  {in:[],out:[]},{in:[],out:[]},{in:[],out:[]},{in:[],out:[]}
 ],
 theme:{accent:"#286044"}
};
let data=load(), page="home", admin=false, kasLogin=false, msgIndex=0, silSearch="";
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    const parsed=raw?JSON.parse(raw):structuredClone(defaults);
    return parsed||structuredClone(defaults);
  }catch(e){return structuredClone(defaults)}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  if(window.firebaseSaveData){ window.firebaseSaveData(data); }
  return true;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return "Rp"+Number(n||0).toLocaleString("id-ID")}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),2200)}
function go(p){page=p;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");renderAll();scrollTo(0,0)}
function renderNav(){
 const items=[["home","🏠 HOME"],["silsilah","🌳 SILSILAH"],["jadwal","📅 JADWAL"],["kas","💰 KAS"],["admin","🔐 ADMIN"]];
 document.getElementById("nav").innerHTML=items.map(([id,t])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${t}</button>`).join("");
 document.getElementById("brand").textContent="🌳 "+data.identity.name;
 document.getElementById("slogan").textContent=data.identity.slogan;
}
function renderAll(){renderNav();renderHome();renderSilsilah();renderJadwal();renderKas();renderAdmin()}
function renderHome(){
 const i=data.identity, m=data.messages[msgIndex%3]||{title:"",body:""};
 document.getElementById("home").innerHTML=`
 <div class="hero"><h2>${esc(i.name)}</h2><p>${esc(i.slogan)}<br>📍 ${esc(i.location)}</p></div>
 <h2 class="section-title">🌿 Selamat Datang</h2><div class="card">${esc(data.welcome)}</div>
 <h2 class="section-title">📢 Info Keluarga</h2>

 <h2 class="section-title">💬 ${esc(m.title)}</h2><div class="card">${esc(m.body)}<br><button class="btn small" onclick="msgIndex=(msgIndex+1)%3;renderHome()">Pesan Berikutnya</button></div>

function ensureSilsilah(){
 if(!data.silsilah||!Array.isArray(data.silsilah.people))data.silsilah=structuredClone(defaults.silsilah);
 const slots=[];
 for(let i=1;i<=16;i++){
  let p=data.silsilah.people.find(x=>Number(x.slot)===i);
  if(!p){p={id:"slot"+i,name:"",parent:"root",gen:2,slot:i};data.silsilah.people.push(p)}
  p.slot=i;p.id=p.id||"slot"+i;p.parent=p.parent||"root";p.gen=generationOf(p.id);
  slots.push(p);
 }
}
function activePeople(){return data.silsilah.people.filter(p=>p.name&&p.name.trim())}
function memberById(id){return data.silsilah.people.find(p=>p.id===id)}
function memberChildren(id){return data.silsilah.people.filter(p=>p.parent===id&&p.name&&p.name.trim())}
function generationOf(id,seen=new Set()){
 if(id==="root")return 1;
 if(seen.has(id))return 1;
 seen.add(id);
 const p=memberById(id);if(!p)return 2;
 return Math.max(2,generationOf(p.parent||"root",seen)+1);
}
function genLabel(n){return n===1?"Pusat Keluarga":n===2?"Anak":n===3?"Cucu":n===4?"Cicit":`Generasi ${n}`}
function pathFor(id){
 const arr=[];let cur=memberById(id),guard=0;
 while(cur&&guard++<30){arr.unshift(cur.name||"(belum diisi)");if(cur.parent==="root"){arr.unshift(data.silsilah.root);break}cur=memberById(cur.parent)}
 return arr.join(" → ");
}
function descendants(id,depth=0,out=[]){
 memberChildren(id).forEach(p=>{out.push({p,depth});descendants(p.id,depth+1,out)});return out;
}
function wouldCreateCycle(id,parent){
 let cur=parent,guard=0;
 while(cur&&cur!=="root"&&guard++<30){if(cur===id)return true;const p=memberById(cur);cur=p?.parent}
 return false;
}

   ${kids.length?`<div class="descendants"><b>Keturunan</b>${kids.map(c=>`<button class="desc-row" onclick="event.stopPropagation();openMemberDetail('${c.id}')"><span>${esc(c.name)}</span><span>${genLabel(generationOf(c.id))}</span></button>`).join("")}</div>`:""}
  </div>`;
 }).join("");

 p.name=name;p.parent=parent;recalcGenerations();save();closeModal();toast('Data anggota diperbarui.');renderAll();
}
function recalcGenerations(){ensureSilsilah();data.silsilah.people.forEach(p=>p.gen=generationOf(p.id))}
function deleteMember(id){const p=data.silsilah.people.find(x=>x.id===id);if(!p)return;const hasKids=memberChildren(id).length;const text=hasKids?'Anggota ini masih memiliki keturunan. Hapus anggota ini saja? Keturunan TIDAK ikut dihapus.':'Hapus anggota ini dari silsilah?';openModal(`<h2>⚠️ Hapus Anggota</h2><p>${text}</p><button class="btn red" onclick="confirmDeleteMember('${id}')">Ya, Hapus Anggota</button>`)}
function confirmDeleteMember(id){
 const p=data.silsilah.people.find(x=>x.id===id);if(!p)return;
 const newParent=p.parent||"root";
 data.silsilah.people.forEach(x=>{if(x.parent===id)x.parent=newParent;});
 if(p.slot){p.name="";p.parent="root";p.gen=2}
 else data.silsilah.people=data.silsilah.people.filter(x=>x.id!==id);
 recalcGenerations();save();closeModal();toast('Anggota berhasil dihapus. Keturunannya tetap dipertahankan.');renderAll();
}

function adminKontak(){let i=data.identity;openModal(`<h2>📞 Kontak & Rekening</h2><label>WhatsApp (contoh 628...)</label><input id="iwa" value="${esc(i.wa)}"><label>Facebook URL</label><input id="ifb" value="${esc(i.fb)}"><label>Google Maps URL</label><input id="imp" value="${esc(i.maps)}"><label>Bank</label><input id="ibank" value="${esc(i.bank)}"><label>Nomor Rekening</label><input id="iacc" value="${esc(i.account)}"><label>Nama Pemilik</label><input id="iown" value="${esc(i.owner)}"><button class="btn gold" onclick="Object.assign(data.identity,{wa:iwa.value,fb:ifb.value,maps:imp.value,bank:ibank.value,account:iacc.value,owner:iown.value});save();closeModal();toast('Kontak disimpan.');renderAll()">Simpan</button>`)}
function adminKas(){openModal(`<h2>💰 Pengaturan Kas</h2><p class="muted">Perubahan nama kas dari sini juga tersimpan pada halaman Kas.</p>${data.kasNames.map((x,n)=>`<label>Kas ${n+1}</label><input id="nk${n}" value="${esc(x)}">`).join("")}<button class="btn gold" onclick="data.kasNames=data.kasNames.map((x,n)=>document.getElementById('nk'+n).value||x);save();closeModal();toast('Nama Kas disimpan.');renderAll()">Simpan</button>`)}
function adminData(){openModal(`<h2>💾 Data & Database</h2><button class="btn" onclick="downloadBackup()">💾 Backup JSON</button><label>Restore JSON</label><input id="restoreFile" type="file" accept=".json" onchange="restoreBackup(event)"><button class="btn gray" onclick="location.reload()">🔄 Refresh</button><button class="btn red" onclick="deleteAll()">🗑️ Hapus Semua Data</button><p class="muted">Hapus semua memerlukan teks HAPUS SEMUA dan hanya mengembalikan data website ke keadaan awal.</p>`)}
function downloadBackup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-keluarga-nene-pala.json";a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const incoming=JSON.parse(r.result);
   if(!incoming||typeof incoming!=="object"||!incoming.identity||!incoming.silsilah) throw new Error("format");
   data=incoming;normalizeData();save();closeModal();toast("Backup berhasil dipulihkan.");renderAll();
  }catch{toast("File JSON tidak valid atau bukan backup website ini.")}
 };
 r.readAsText(f);
}
function deleteAll(){openModal(`<h2>⚠️ Hapus Semua Data</h2><p>Tindakan ini mengembalikan data ke kondisi awal.</p><input id="del" placeholder="Ketik HAPUS SEMUA"><button class="btn red" onclick="if(del.value==='HAPUS SEMUA'){data=structuredClone(defaults);save();closeModal();toast('Data dikembalikan ke awal.');renderAll()}else toast('Teks konfirmasi salah.')">Konfirmasi Hapus</button>`)}
function openModal(html){document.getElementById("modal").innerHTML=`<div>${html}<div style="text-align:right;margin-top:15px"><button class="btn gray" onclick="closeModal()">Tutup</button></div></div>`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden");document.getElementById("modal").innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modal").classList.contains("hidden"))closeModal()});

window.getCurrentData=function(){return data;};
window.dataFromFirebase=function(remote){
  try{
    data=remote||data;
    normalizeData();
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
    renderAll();
    toast("Data online diperbarui.");
  }catch(e){console.error("Gagal menerapkan data Firebase:",e);}
};

window.addEventListener("storage",()=>{data=load();renderAll()});
normalizeData();
renderAll();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  apiKey: "AIzaSyBNJaaOlNoO7m3kTe4v_S5TrxI9SXtW2mk",

  projectId: "jualan-web-5cdfc",

  messagingSenderId: "174489399548",
  appId: "1:174489399548:web:ba054934fe3de1daa12779"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dataRef = doc(db, "nenePala", "data");
let firstSnapshot = true;

window.firebaseSaveData = async function(payload){
  try{
    await setDoc(dataRef, payload);
  }catch(error){
    console.error("Firebase save error:", error);
    if(typeof toast==="function") toast("Gagal menyimpan ke Firebase.");
  }
};

onSnapshot(dataRef, (snapshot)=>{
  if(snapshot.exists()){
    if(window.dataFromFirebase) window.dataFromFirebase(snapshot.data());
  }else if(firstSnapshot){
    if(window.getCurrentData) window.firebaseSaveData(window.getCurrentData());
  }
  firstSnapshot=false;
}, (error)=>{
  console.error("Firebase realtime error:", error);
  if(typeof toast==="function") toast("Firebase belum terhubung. Periksa Firestore Rules.");
});
</script>
